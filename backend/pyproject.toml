[project]
name = "aegis"
version = "0.1.0"
description = "Sovereign PII proxy for LLMs and agents"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.1",
    "gliner>=0.2.13",
    "openai>=1.40",
    "tiktoken>=0.14.0",
    "transformers>=4.51.3,<5",
    "protobuf>=7.36.2",
    "torch>=2.14.1,<3",
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[project.scripts]
aegis = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "packs"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "anthropic>=2.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
