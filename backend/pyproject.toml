[project]
name = "aegis"
version = "0.1.0"
description = "Sovereign PII proxy for LLMs and agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "gliner>=0.2.13",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "asgi-lifespan>=2.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
