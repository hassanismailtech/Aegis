name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heldout-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gliner-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}

      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Held-out recall floor
        working-directory: backend
        env:
          # CI measures model quality, not laptop speed; bench_scrub.py owns latency.
          NER_TIMEOUT_MS: "10000"
          EVAL_RECALL_FLOOR: ${{ vars.EVAL_RECALL_FLOOR || '0.85' }}
        run: uv run python scripts/eval_heldout.py --floor "$EVAL_RECALL_FLOOR"
